name: Principle Synthesis Contract

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "skills/**"
      - "templates/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/principle-synthesis-contract.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "skills/**"
      - "templates/**"
      - "config/**"
      - "tests/**"

jobs:
  structural-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontmatter validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Validate all skill frontmatter
        run: python tests/check_skills.py
      - name: Test metadata and registry validation
        run: python -m unittest discover -s tests -p 'test_skill_validation.py'
      - name: Validate synthesis skill contracts and links
        run: python3 tests/check_principle_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check native document text ranges and trailing letters
        run: node --test tests/test_native_text_ranges.mjs

# This checks static process contracts and native text-range arithmetic, not LLM reasoning correctness.
# Behavioral evidence-to-principle tests are in tests/principle-synthesis-cases.md.
